name: GCP Native - Deploy Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version to deploy"
        required: true
        default: "v1"

jobs:
  deploy-model:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1

      MODEL_VERSION: ${{ inputs.model_version }}

      MODEL_DISPLAY_NAME: titanic-random-forest
      ENDPOINT_DISPLAY_NAME: titanic-random-forest-endpoint

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Authenticate GCP
      # ==========================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'


      # ==========================================
      # Setup Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # Setup Terraform
      # ==========================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ==========================================
      # Initialize Terraform
      # ==========================================

      - name: Initialize Terraform
        working-directory: terraform/gcp
        run: |
          terraform init -input=false


      # ==========================================
      # Get infrastructure outputs
      # ==========================================

      - name: Get Terraform outputs
        working-directory: terraform/gcp
        run: |
          echo "MODEL_BUCKET=$(terraform output -raw model_bucket_name)" >> "$GITHUB_ENV"

          echo "ARTIFACT_REGISTRY_URL=$(terraform output -raw artifact_registry_repository_url)" >> "$GITHUB_ENV"


      # ==========================================
      # Show configuration
      # ==========================================

      - name: Show configuration
        run: |
          echo "GCP_PROJECT_ID=${GCP_PROJECT_ID}"
          echo "GCP_REGION=${GCP_REGION}"
          echo "MODEL_VERSION=${MODEL_VERSION}"
          echo "MODEL_BUCKET=${MODEL_BUCKET}"
          echo "ARTIFACT_REGISTRY_URL=${ARTIFACT_REGISTRY_URL}"


      # ==========================================
      # Verify model
      # ==========================================

      - name: Verify model artifact
        run: |
          gcloud storage ls \
            "gs://${MODEL_BUCKET}/models/${MODEL_VERSION}/"


      # ==========================================
      # Configure Docker
      # ==========================================

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet


      # ==========================================
      # Install dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            -r ml/gcp/requirements.txt


      # ==========================================
      # Build & deploy model
      # ==========================================

      - name: Deploy model
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}" \
          python ml/gcp/deploy.py


      # ==========================================
      # Show resources
      # ==========================================

      - name: Show Vertex models
        run: |
          gcloud ai models list \
            --region="${GCP_REGION}"


      - name: Show Vertex endpoints
        run: |
          gcloud ai endpoints list \
            --region="${GCP_REGION}"