name: AWS Kubernetes - Platform

on:
  workflow_dispatch:

jobs:
  platform:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: mlops-thesis-k8s

      MLFLOW_ECR_REPOSITORY: mlops-thesis-k8s-mlflow
      MLFLOW_IMAGE_TAG: v1

      STORAGE_CLASS: gp3

      POSTGRES_PASSWORD: password

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        working-directory: terraform/kubernetes/aws
        run: |
          terraform init \
            -input=false



      - name: Get Terraform outputs
        working-directory: terraform/kubernetes/aws
        run: |
          MODEL_BUCKET="$(terraform output -raw model_bucket_name)"

          if [[ -z "${MODEL_BUCKET}" ]]; then
            echo "ERROR: Terraform returned an empty model bucket name."
            exit 1
          fi

          echo "MODEL_BUCKET=${MODEL_BUCKET}" >> "$GITHUB_ENV"

          echo "Resolved model bucket:"
          echo "${MODEL_BUCKET}"



      - name: Refresh EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --alias "${EKS_CLUSTER_NAME}"

          kubectl config use-context "${EKS_CLUSTER_NAME}"



      - name: Check AWS identity
        run: |
          aws sts get-caller-identity



      - name: Show resolved configuration
        run: |
          echo "AWS Region: ${AWS_REGION}"
          echo "EKS Cluster: ${EKS_CLUSTER_NAME}"
          echo "MLflow ECR Repository: ${MLFLOW_ECR_REPOSITORY}"
          echo "MLflow Image Tag: ${MLFLOW_IMAGE_TAG}"
          echo "Model Bucket: ${MODEL_BUCKET}"
          echo "Storage Class: ${STORAGE_CLASS}"




      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build MLflow image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -f docker/mlflow/Dockerfile \
            -t "${ECR_REGISTRY}/${MLFLOW_ECR_REPOSITORY}:${MLFLOW_IMAGE_TAG}" \
            .


      - name: Push MLflow image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker push \
            "${ECR_REGISTRY}/${MLFLOW_ECR_REPOSITORY}:${MLFLOW_IMAGE_TAG}"


      - name: Check Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes


      - name: Apply namespace
        run: |
          kubectl apply \
            -f kubernetes/namespace.yaml

      - name: Apply AWS ServiceAccounts
        run: |
          kubectl apply \
            -f kubernetes/aws-service-accounts.yaml


      - name: Apply AWS StorageClass
        run: |
          kubectl apply \
            -f kubernetes/aws-storage-class.yaml


      - name: Check storage class
        run: |
          kubectl get storageclass
          kubectl get storageclass "${STORAGE_CLASS}"


      - name: Prepare PostgreSQL secret
        run: |
          sed \
            -e "s|POSTGRES_PASSWORD_PLACEHOLDER|${POSTGRES_PASSWORD}|g" \
            kubernetes/postgres/secret.yaml \
            > /tmp/postgres-secret.yaml


      - name: Apply PostgreSQL configuration
        run: |
          kubectl apply \
            -f kubernetes/postgres/config.yaml

          kubectl apply \
            -f /tmp/postgres-secret.yaml


      - name: Prepare PostgreSQL StatefulSet
        run: |
          sed \
            -e "s|STORAGE_CLASS_PLACEHOLDER|${STORAGE_CLASS}|g" \
            kubernetes/postgres/deployment.yaml \
            > /tmp/postgres-statefulset.yaml


      - name: Apply PostgreSQL StatefulSet
        run: |
          kubectl apply \
            -f /tmp/postgres-statefulset.yaml

          echo "=== PostgreSQL StatefulSets ==="

          kubectl get statefulset \
            -n mlops

          echo "=== PostgreSQL PVCs ==="

          kubectl get pvc \
            -n mlops

      - name: Apply PostgreSQL service
        run: |
          kubectl apply \
            -f kubernetes/postgres/service.yaml


      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status \
            statefulset/postgres \
            -n mlops \
            --timeout=10m


      - name: Check PostgreSQL
        run: |
          echo "=== PostgreSQL Pods ==="

          kubectl get pods \
            -n mlops \
            -l app=postgres \
            -o wide

          echo ""

          echo "=== PostgreSQL PVCs ==="

          kubectl get pvc \
            -n mlops


      - name: Prepare MLflow config
        run: |
          cat > /tmp/mlflow-config.yaml <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: mlflow-config
            namespace: mlops
          data:
            ARTIFACTS_DESTINATION: s3://${MODEL_BUCKET}/mlflow
          EOF

          echo "=== Generated MLflow configuration ==="
          cat /tmp/mlflow-config.yaml


      - name: Apply MLflow config
        run: |
          kubectl apply \
            -f /tmp/mlflow-config.yaml


      - name: Verify MLflow config
        run: |
          echo "=== MLflow artifact destination ==="

          ACTUAL="$(kubectl get configmap mlflow-config \
            -n mlops \
            -o jsonpath='{.data.ARTIFACTS_DESTINATION}')"

          EXPECTED="s3://${MODEL_BUCKET}/mlflow"

          echo "Expected: ${EXPECTED}"
          echo "Actual:   ${ACTUAL}"

          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "ERROR: MLflow artifact destination is incorrect."
            exit 1
          fi

          echo "MLflow artifact destination is correct."


      - name: Prepare MLflow Deployment
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          sed \
            -e "s|MLFLOW_IMAGE_PLACEHOLDER|${ECR_REGISTRY}/${MLFLOW_ECR_REPOSITORY}:${MLFLOW_IMAGE_TAG}|g" \
            kubernetes/mlflow/deployment.yaml \
            > /tmp/mlflow-deployment.yaml



      - name: Apply MLflow Deployment
        run: |
          kubectl apply \
            -f /tmp/mlflow-deployment.yaml



      - name: Restart MLflow
        run: |
          kubectl rollout restart \
            deployment/mlflow \
            -n mlops

          kubectl rollout status \
            deployment/mlflow \
            -n mlops \
            --timeout=10m


      - name: Apply MLflow service
        run: |
          kubectl apply \
            -f kubernetes/mlflow/service.yaml

      - name: Show platform status
        run: |
          echo "=== Pods ==="

          kubectl get pods \
            -n mlops \
            -o wide

          echo ""

          echo "=== Services ==="

          kubectl get services \
            -n mlops

          echo ""

          echo "=== PVCs ==="

          kubectl get pvc \
            -n mlops

          echo ""

          echo "=== StorageClasses ==="

          kubectl get storageclass