name: Azure Kubernetes - Build Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version"
        required: true
        default: "v1"

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    env:
      ARM_SUBSCRIPTION_ID: a71b1a56-760a-4510-9453-9525c3b99c8f
      ARM_CLIENT_ID: 53c2023d-035b-4459-a043-d5f9b50a032c
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: d81a2e37-d18e-42ec-8839-9a2de1586e0c

      MODEL_VERSION: ${{ inputs.model_version }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ env.ARM_CLIENT_ID }}",
              "clientSecret": "${{ env.ARM_CLIENT_SECRET }}",
              "tenantId": "${{ env.ARM_TENANT_ID }}",
              "subscriptionId": "${{ env.ARM_SUBSCRIPTION_ID }}"
            }


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        working-directory: terraform/kubernetes/azure
        run: |
          terraform init \
            -input=false



      - name: Get Terraform outputs
        working-directory: terraform/kubernetes/azure
        run: |
          echo "AKS_CLUSTER_NAME=$(terraform output -raw cluster_name)" >> "$GITHUB_ENV"
          echo "AKS_RESOURCE_GROUP=$(terraform output -raw resource_group_name)" >> "$GITHUB_ENV"
          echo "ACR_NAME=$(terraform output -raw acr_name)" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)" >> "$GITHUB_ENV"


      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${AKS_RESOURCE_GROUP}" \
            --name "${AKS_CLUSTER_NAME}" \
            --overwrite-existing


      - name: Check Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Check Training ServiceAccount
        run: |
          kubectl get serviceaccount mlops-training \
            -n mlops \
            -o yaml


      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "${ACR_NAME}"


      - name: Build training image
        run: |
          docker build \
            -f docker/train/Dockerfile \
            -t "${ACR_LOGIN_SERVER}/mlops-thesis-k8s-train:${MODEL_VERSION}" \
            .


      - name: Push training image
        run: |
          docker push \
            "${ACR_LOGIN_SERVER}/mlops-thesis-k8s-train:${MODEL_VERSION}"


      - name: Prepare training Job
        env:
          ACR_LOGIN_SERVER: ${{ env.ACR_LOGIN_SERVER }}
          MODEL_VERSION: ${{ env.MODEL_VERSION }}
        run: |
          python -m pip install --quiet pyyaml

          python <<'PY'
          import os
          import yaml

          source = "kubernetes/training/job.yaml"
          target = "/tmp/training-job.yaml"

          acr_login_server = os.environ["ACR_LOGIN_SERVER"]
          model_version = os.environ["MODEL_VERSION"]

          image = (
              f"{acr_login_server}/"
              f"mlops-thesis-k8s-train:"
              f"{model_version}"
          )

          with open(source, "r", encoding="utf-8") as f:
              document = yaml.safe_load(f)

          pod_template = document["spec"]["template"]

          # ------------------------------------------
          # Azure Workload Identity
          # ------------------------------------------

          pod_template.setdefault("metadata", {})
          pod_template["metadata"].setdefault("labels", {})

          pod_template["metadata"]["labels"][
              "azure.workload.identity/use"
          ] = "true"

          # ------------------------------------------
          # Azure ServiceAccount
          # ------------------------------------------

          pod_template.setdefault("spec", {})

          pod_template["spec"][
              "serviceAccountName"
          ] = "mlops-training"

          # ------------------------------------------
          # Training image
          # ------------------------------------------

          containers = pod_template["spec"]["containers"]

          if not containers:
              raise RuntimeError(
                  "Training Job does not contain any containers."
              )

          containers[0]["image"] = image

          # ------------------------------------------
          # MODEL_VERSION
          # ------------------------------------------

          env = containers[0].setdefault("env", [])

          model_version_found = False

          for item in env:
              if item.get("name") == "MODEL_VERSION":
                  item["value"] = model_version
                  model_version_found = True
                  break

          if not model_version_found:
              env.append({
                  "name": "MODEL_VERSION",
                  "value": model_version,
              })

          with open(target, "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  document,
                  f,
                  sort_keys=False,
                  default_flow_style=False,
              )

          print(f"Training image: {image}")
          print("ServiceAccount: mlops-training")
          print("Azure Workload Identity enabled: true")
          print(f"Model version: {model_version}")
          PY


      - name: Start training Job
        run: |
          kubectl delete job mlops-training \
            -n mlops \
            --ignore-not-found

          kubectl apply \
            -f /tmp/training-job.yaml



      - name: Check training status
        run: |
          kubectl get jobs -n mlops

          echo ""

          kubectl get pods \
            -n mlops \
            -o wide


      - name: Wait for training Job
        run: |
          kubectl wait \
            --for=condition=complete \
            job/mlops-training \
            -n mlops \
            --timeout=30m


      - name: Show training logs
        run: |
          kubectl logs \
            -n mlops \
            job/mlops-training