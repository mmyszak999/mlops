name: Azure Kubernetes - Build Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version"
        required: true
        default: "v1"

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    env:
      ARM_SUBSCRIPTION_ID: a71b1a56-760a-4510-9453-9525c3b99c8f
      ARM_CLIENT_ID: 53c2023d-035b-4459-a043-d5f9b50a032c
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: d81a2e37-d18e-42ec-8839-9a2de1586e0c

      MODEL_VERSION: ${{ inputs.model_version }}

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Azure Login
      # ==========================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ env.ARM_CLIENT_ID }}",
              "clientSecret": "${{ env.ARM_CLIENT_SECRET }}",
              "tenantId": "${{ env.ARM_TENANT_ID }}",
              "subscriptionId": "${{ env.ARM_SUBSCRIPTION_ID }}"
            }


      # ==========================================
      # Setup Terraform
      # ==========================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ==========================================
      # Terraform Init
      # ==========================================

      - name: Terraform Init
        working-directory: terraform/kubernetes/azure
        run: |
          terraform init \
            -input=false


      # ==========================================
      # Terraform outputs
      # ==========================================

      - name: Get Terraform outputs
        working-directory: terraform/kubernetes/azure
        run: |
          echo "AKS_CLUSTER_NAME=$(terraform output -raw cluster_name)" >> "$GITHUB_ENV"
          echo "AKS_RESOURCE_GROUP=$(terraform output -raw resource_group_name)" >> "$GITHUB_ENV"
          echo "ACR_NAME=$(terraform output -raw acr_name)" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)" >> "$GITHUB_ENV"

          echo "TRAINING_IDENTITY_CLIENT_ID=$(terraform output -raw training_identity_client_id)" >> "$GITHUB_ENV"


      # ==========================================
      # Get AKS credentials
      # ==========================================

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${AKS_RESOURCE_GROUP}" \
            --name "${AKS_CLUSTER_NAME}" \
            --overwrite-existing


      # ==========================================
      # Check Kubernetes
      # ==========================================

      - name: Check Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide


      # ==========================================
      # Login to ACR
      # ==========================================

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "${ACR_NAME}"


      # ==========================================
      # Build training image
      # ==========================================

      - name: Build training image
        run: |
          docker build \
            -f docker/train/Dockerfile \
            -t "${ACR_LOGIN_SERVER}/mlops-thesis-k8s-train:${MODEL_VERSION}" \
            .


      # ==========================================
      # Push training image
      # ==========================================

      - name: Push training image
        run: |
          docker push \
            "${ACR_LOGIN_SERVER}/mlops-thesis-k8s-train:${MODEL_VERSION}"


      # ==========================================
      # Configure training ServiceAccount
      # ==========================================

      - name: Configure Training Azure Workload Identity
        run: |
          kubectl annotate serviceaccount training \
            -n mlops \
            azure.workload.identity/client-id="${TRAINING_IDENTITY_CLIENT_ID}" \
            --overwrite


      # ==========================================
      # Prepare training Job
      # ==========================================

      - name: Prepare training Job
        run: |
          python -m pip install --quiet pyyaml

          python <<'PY'
          import yaml

          source = "kubernetes/training/job.yaml"
          target = "/tmp/training-job.yaml"

          with open(source, "r", encoding="utf-8") as f:
              document = yaml.safe_load(f)

          document["spec"]["template"]["metadata"] = (
              document["spec"]["template"].get("metadata", {})
          )

          document["spec"]["template"]["metadata"]["labels"] = (
              document["spec"]["template"]["metadata"].get("labels", {})
          )

          document["spec"]["template"]["metadata"]["labels"][
              "azure.workload.identity/use"
          ] = "true"

          container = document["spec"]["template"]["spec"]["containers"][0]

          image = (
              "${ACR_LOGIN_SERVER}/mlops-thesis-k8s-train:"
              "${MODEL_VERSION}"
          )

          container["image"] = image

          env = container.get("env", [])

          for item in env:
              if item.get("name") == "MODEL_VERSION":
                  item["value"] = "${MODEL_VERSION}"

          with open(target, "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  document,
                  f,
                  sort_keys=False,
                  default_flow_style=False,
              )
          PY


      # ==========================================
      # Start training Job
      # ==========================================

      - name: Start training Job
        run: |
          kubectl delete job mlops-training \
            -n mlops \
            --ignore-not-found

          kubectl apply \
            -f /tmp/training-job.yaml


      # ==========================================
      # Check training Pod
      # ==========================================

      - name: Check training status
        run: |
          kubectl get jobs -n mlops

          echo ""

          kubectl get pods \
            -n mlops \
            -o wide


      # ==========================================
      # Wait for training
      # ==========================================

      - name: Wait for training Job
        run: |
          kubectl wait \
            --for=condition=complete \
            job/mlops-training \
            -n mlops \
            --timeout=30m


      # ==========================================
      # Logs
      # ==========================================

      - name: Show training logs
        run: |
          kubectl logs \
            -n mlops \
            job/mlops-training