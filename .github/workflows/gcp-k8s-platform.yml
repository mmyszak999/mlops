name: GCP Kubernetes - Platform

on:
  workflow_dispatch:

jobs:
  platform:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: project-6e2348ec-04b1-4ad0-9e5
      GCP_REGION: us-central1

      GKE_CLUSTER_NAME: mlops-thesis-gke

      MLFLOW_IMAGE_TAG: v1

      POSTGRES_PASSWORD: password

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'


      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin


      - name: Check GCP identity
        run: |
          gcloud auth list --filter=status:ACTIVE

          echo ""
          echo "Project:"
          gcloud config get-value project

          echo ""
          echo "GKE auth plugin:"
          gke-gcloud-auth-plugin --version


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        working-directory: terraform/kubernetes/gcp
        run: |
          terraform init -input=false


      - name: Get Terraform outputs
        working-directory: terraform/kubernetes/gcp
        run: |
          echo "GKE_CLUSTER_NAME=$(terraform output -raw cluster_name)" >> "$GITHUB_ENV"
          echo "GKE_ZONE=$(terraform output -raw cluster_zone)" >> "$GITHUB_ENV"
          echo "GCP_REGION=$(terraform output -raw cluster_region)" >> "$GITHUB_ENV"
          echo "MODEL_BUCKET=$(terraform output -raw model_bucket_name)" >> "$GITHUB_ENV"
          echo "ARTIFACT_REGISTRY_URL=$(terraform output -raw artifact_registry_repository_url)" >> "$GITHUB_ENV"

          echo "GCP_TRAINING_SERVICE_ACCOUNT=$(terraform output -raw training_service_account_email)" >> "$GITHUB_ENV"
          echo "GCP_INFERENCE_SERVICE_ACCOUNT=$(terraform output -raw inference_service_account_email)" >> "$GITHUB_ENV"
          echo "GCP_MLFLOW_SERVICE_ACCOUNT=$(terraform output -raw mlflow_service_account_email)" >> "$GITHUB_ENV"

      - name: Show configuration
        run: |
          echo "Project: ${GCP_PROJECT_ID}"
          echo "Region: ${GCP_REGION}"
          echo "Zone: ${GKE_ZONE}"
          echo "Cluster: ${GKE_CLUSTER_NAME}"
          echo "Model bucket: ${MODEL_BUCKET}"
          echo "Artifact Registry: ${ARTIFACT_REGISTRY_URL}"


      - name: Set GCP project
        run: |
          gcloud config set project "${GCP_PROJECT_ID}"


      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet


      - name: Build MLflow image
        run: |
          docker build \
            -f docker/mlflow/Dockerfile \
            -t "${ARTIFACT_REGISTRY_URL}/mlops-thesis-k8s-mlflow:${MLFLOW_IMAGE_TAG}" \
            .


      - name: Push MLflow image
        run: |
          docker push \
            "${ARTIFACT_REGISTRY_URL}/mlops-thesis-k8s-mlflow:${MLFLOW_IMAGE_TAG}"



      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            "${GKE_CLUSTER_NAME}" \
            --zone="${GKE_ZONE}" \
            --project="${GCP_PROJECT_ID}"


      - name: Check Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide


      - name: Apply namespace
        run: |
          kubectl apply \
            -f kubernetes/namespace.yaml


      - name: Prepare GCP ServiceAccounts
        run: |
          sed \
            -e "s|GCP_TRAINING_SERVICE_ACCOUNT|${GCP_TRAINING_SERVICE_ACCOUNT}|g" \
            -e "s|GCP_INFERENCE_SERVICE_ACCOUNT|${GCP_INFERENCE_SERVICE_ACCOUNT}|g" \
            -e "s|GCP_MLFLOW_SERVICE_ACCOUNT|${GCP_MLFLOW_SERVICE_ACCOUNT}|g" \
            kubernetes/gcp-service-accounts.yaml \
            > /tmp/gcp-service-accounts.yaml


      - name: Apply GCP ServiceAccounts
        run: |
          kubectl apply \
            -f /tmp/gcp-service-accounts.yaml


      - name: Apply GCP StorageClass
        run: |
          kubectl apply \
            -f kubernetes/gcp-storage-class.yaml




      - name: Check StorageClass
        run: |
          kubectl get storageclass


  

      - name: Prepare PostgreSQL secret
        run: |
          sed \
            -e "s|POSTGRES_PASSWORD_PLACEHOLDER|${POSTGRES_PASSWORD}|g" \
            kubernetes/postgres/secret.yaml \
            > /tmp/postgres-secret.yaml



      - name: Apply PostgreSQL configuration
        run: |
          kubectl apply \
            -f kubernetes/postgres/config.yaml

          kubectl apply \
            -f /tmp/postgres-secret.yaml


      - name: Prepare PostgreSQL StatefulSet
        run: |
          sed \
            -e "s|STORAGE_CLASS_PLACEHOLDER|gcp-standard-rwo|g" \
            kubernetes/postgres/deployment.yaml \
            > /tmp/postgres-statefulset.yaml


      - name: Apply PostgreSQL StatefulSet
        run: |
          kubectl apply \
            -f /tmp/postgres-statefulset.yaml


      - name: Apply PostgreSQL service
        run: |
          kubectl apply \
            -f kubernetes/postgres/service.yaml


      - name: Wait for PostgreSQL
        run: |
          kubectl wait \
            --for=condition=ready \
            pod/postgres-0 \
            -n mlops \
            --timeout=10m

      - name: Check PostgreSQL
        run: |
          kubectl get pods \
            -n mlops \
            -l app=postgres \
            -o wide

          echo ""

          kubectl get pvc \
            -n mlops

      - name: Prepare MLflow config
        run: |
          sed \
            -e "s|ARTIFACTS_DESTINATION_PLACEHOLDER|gs://${MODEL_BUCKET}/mlflow|g" \
            kubernetes/mlflow/config.yaml \
            > /tmp/mlflow-config.yaml


      - name: Apply MLflow config
        run: |
          kubectl apply \
            -f /tmp/mlflow-config.yaml

      - name: Prepare MLflow Deployment
        run: |
          sed \
            -e "s|MLFLOW_IMAGE_PLACEHOLDER|${ARTIFACT_REGISTRY_URL}/mlops-thesis-k8s-mlflow:${MLFLOW_IMAGE_TAG}|g" \
            kubernetes/mlflow/deployment.yaml \
            > /tmp/mlflow-deployment.yaml


      - name: Apply MLflow Deployment
        run: |
          kubectl apply \
            -f /tmp/mlflow-deployment.yaml


      - name: Apply MLflow service
        run: |
          kubectl apply \
            -f kubernetes/mlflow/service.yaml


      - name: Wait for MLflow
        run: |
          kubectl wait \
            --for=condition=available \
            deployment/mlflow \
            -n mlops \
            --timeout=10m


      - name: Check MLflow
        run: |
          kubectl get pods \
            -n mlops \
            -l app=mlflow \
            -o wide

          echo ""

          kubectl get service \
            mlflow \
            -n mlops


      - name: Show platform status
        run: |
          echo "=== Pods ==="
          kubectl get pods -n mlops -o wide

          echo ""
          echo "=== Services ==="
          kubectl get services -n mlops

          echo ""
          echo "=== PVCs ==="
          kubectl get pvc -n mlops

          echo ""
          echo "=== StorageClasses ==="
          kubectl get storageclass

          echo ""
          echo "=== ServiceAccounts ==="
          kubectl get serviceaccounts -n mlops