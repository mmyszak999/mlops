name: AWS Native - Build Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version"
        required: true
        default: "v1"

jobs:
  train-model:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      MODEL_VERSION: ${{ inputs.model_version }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/aws
        run: |
          terraform init \
            -input=false

      - name: Get Terraform outputs
        working-directory: terraform/aws
        run: |
          MODEL_BUCKET="$(terraform output -raw bucket_name)"

          if [[ -z "${MODEL_BUCKET}" ]]; then
            echo "ERROR: Terraform returned an empty model bucket."
            exit 1
          fi

          echo "MODEL_BUCKET=${MODEL_BUCKET}" >> "$GITHUB_ENV"

          echo "Model bucket: ${MODEL_BUCKET}"

      - name: Install dependencies
        run: |
          pip install -r ml/aws/requirements.txt

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity


      - name: Train model
        env:
          MODEL_BUCKET: ${{ env.MODEL_BUCKET }}
          MODEL_VERSION: ${{ env.MODEL_VERSION }}
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}" \
          python -m ml.aws.train