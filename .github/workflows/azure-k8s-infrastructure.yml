name: Azure Kubernetes - Infrastructure

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/kubernetes/azure

    env:
      ARM_SUBSCRIPTION_ID: a71b1a56-760a-4510-9453-9525c3b99c8f
      ARM_CLIENT_ID: 53c2023d-035b-4459-a043-d5f9b50a032c
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: d81a2e37-d18e-42ec-8839-9a2de1586e0c

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Azure Login
      # ==========================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ env.ARM_CLIENT_ID }}",
              "clientSecret": "${{ env.ARM_CLIENT_SECRET }}",
              "tenantId": "${{ env.ARM_TENANT_ID }}",
              "subscriptionId": "${{ env.ARM_SUBSCRIPTION_ID }}"
            }


      # ==========================================
      # Check Azure identity
      # ==========================================

      - name: Check Azure identity
        run: |
          az account show \
            --subscription "${ARM_SUBSCRIPTION_ID}" \
            --query "{name:name,id:id,tenantId:tenantId,state:state}" \
            -o table


      # ==========================================
      # Setup Terraform
      # ==========================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ==========================================
      # Terraform Init
      # ==========================================

      - name: Terraform Init
        run: |
          terraform init \
            -input=false


      # ==========================================
      # Terraform Format
      # ==========================================

      - name: Terraform Format
        run: |
          terraform fmt -check -recursive


      # ==========================================
      # Terraform Validate
      # ==========================================

      - name: Terraform Validate
        run: |
          terraform validate


      # ==========================================
      # Terraform Plan
      # ==========================================

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false


      # ==========================================
      # Terraform Apply
      # ==========================================

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve


      # ==========================================
      # Terraform Outputs
      # ==========================================

      - name: Terraform Outputs
        run: |
          echo "=== Terraform Outputs ==="

          terraform output


      # ==========================================
      # Show AKS information
      # ==========================================

      - name: Show AKS information
        run: |
          echo "=== AKS Cluster ==="

          terraform output -raw cluster_name

          echo ""
          echo "=== AKS Region ==="

          terraform output -raw cluster_region

          echo ""
          echo "=== Resource Group ==="

          terraform output -raw resource_group_name

          echo ""
          echo "=== ACR ==="

          terraform output -raw acr_login_server

          echo ""
          echo "=== Storage Account ==="

          terraform output -raw model_storage_account_name