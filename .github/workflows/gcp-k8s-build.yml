name: GCP Kubernetes - Build Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version"
        required: true
        default: "v1"

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: project-6e2348ec-04b1-4ad0-9e5
      GCP_REGION: us-central1

      MODEL_VERSION: ${{ inputs.model_version }}

      GKE_CLUSTER_NAME: mlops-thesis-gke

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


 

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'


      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin



      - name: Check GCP configuration
        run: |
          echo "Project: ${GCP_PROJECT_ID}"
          echo "Region: ${GCP_REGION}"
          echo "Cluster: ${GKE_CLUSTER_NAME}"

          echo ""
          echo "Active identity:"
          gcloud auth list --filter=status:ACTIVE

          echo ""
          echo "GKE auth plugin:"
          gke-gcloud-auth-plugin --version


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3




      - name: Terraform Init
        working-directory: terraform/kubernetes/gcp
        run: |
          terraform init -input=false



      - name: Get Terraform outputs
        working-directory: terraform/kubernetes/gcp
        run: |
          echo "GKE_CLUSTER_NAME=$(terraform output -raw cluster_name)" >> "$GITHUB_ENV"
          echo "GKE_ZONE=$(terraform output -raw cluster_zone)" >> "$GITHUB_ENV"
          echo "GCP_REGION=$(terraform output -raw cluster_region)" >> "$GITHUB_ENV"

          echo "ARTIFACT_REGISTRY_URL=$(terraform output -raw artifact_registry_repository_url)" >> "$GITHUB_ENV"

          echo "GCP_TRAINING_SERVICE_ACCOUNT=$(terraform output -raw training_service_account_email)" >> "$GITHUB_ENV"
          echo "GCP_INFERENCE_SERVICE_ACCOUNT=$(terraform output -raw inference_service_account_email)" >> "$GITHUB_ENV"
          echo "GCP_MLFLOW_SERVICE_ACCOUNT=$(terraform output -raw mlflow_service_account_email)" >> "$GITHUB_ENV"


      - name: Show Terraform outputs
        run: |
          echo "Project: ${GCP_PROJECT_ID}"
          echo "Region: ${GCP_REGION}"
          echo "Zone: ${GKE_ZONE}"
          echo "Cluster: ${GKE_CLUSTER_NAME}"
          echo "Artifact Registry: ${ARTIFACT_REGISTRY_URL}"
          echo "Model version: ${MODEL_VERSION}"

      - name: Set GCP project
        run: |
          gcloud config set project "${GCP_PROJECT_ID}"



      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Build training image
        run: |
          docker build \
            -f docker/train/Dockerfile \
            -t "${ARTIFACT_REGISTRY_URL}/mlops-thesis-k8s-train:${MODEL_VERSION}" \
            .


      - name: Push training image
        run: |
          docker push \
            "${ARTIFACT_REGISTRY_URL}/mlops-thesis-k8s-train:${MODEL_VERSION}"


      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            "${GKE_CLUSTER_NAME}" \
            --zone="${GKE_ZONE}" \
            --project="${GCP_PROJECT_ID}"


      - name: Check Kubernetes access
        run: |
          kubectl cluster-info

          echo ""
          echo "=== Nodes ==="
          kubectl get nodes -o wide


      - name: Apply namespace
        run: |
          kubectl apply \
            -f kubernetes/namespace.yaml


      - name: Prepare GCP ServiceAccounts
        run: |
          sed \
            -e "s|GCP_TRAINING_SERVICE_ACCOUNT|${GCP_TRAINING_SERVICE_ACCOUNT}|g" \
            -e "s|GCP_INFERENCE_SERVICE_ACCOUNT|${GCP_INFERENCE_SERVICE_ACCOUNT}|g" \
            -e "s|GCP_MLFLOW_SERVICE_ACCOUNT|${GCP_MLFLOW_SERVICE_ACCOUNT}|g" \
            kubernetes/gcp-service-accounts.yaml \
            > /tmp/gcp-service-accounts.yaml


      - name: Apply GCP ServiceAccounts
        run: |
          kubectl apply \
            -f /tmp/gcp-service-accounts.yaml


      - name: Check ServiceAccounts
        run: |
          kubectl get serviceaccounts \
            -n mlops


      - name: Prepare training Job
        run: |
          sed \
            -e "s|IMAGE_PLACEHOLDER|${ARTIFACT_REGISTRY_URL}/mlops-thesis-k8s-train:${MODEL_VERSION}|g" \
            -e "s|MODEL_VERSION_PLACEHOLDER|${MODEL_VERSION}|g" \
            kubernetes/training/job.yaml \
            > /tmp/training-job.yaml

          echo "=== Generated training Job ==="
          cat /tmp/training-job.yaml


      - name: Start training Job
        run: |
          kubectl delete job mlops-training \
            -n mlops \
            --ignore-not-found

          kubectl apply \
            -f /tmp/training-job.yaml


      - name: Check training status
        run: |
          echo "=== Jobs ==="
          kubectl get jobs \
            -n mlops

          echo ""
          echo "=== Pods ==="
          kubectl get pods \
            -n mlops \
            -o wide



      - name: Wait for training Job
        run: |
          kubectl wait \
            --for=condition=complete \
            job/mlops-training \
            -n mlops \
            --timeout=20m

      - name: Show training logs
        run: |
          kubectl logs \
            -n mlops \
            job/mlops-training