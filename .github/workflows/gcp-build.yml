name: GCP Native - Build Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version"
        required: true
        default: "v1"

jobs:
  build-model:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      MODEL_VERSION: ${{ inputs.model_version }}
      PYTHONPATH: ${{ github.workspace }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform/gcp
        run: |
          terraform init -input=false


      - name: Get model bucket
        working-directory: terraform/gcp
        run: |
          echo "MODEL_BUCKET=$(terraform output -raw model_bucket_name)" >> "$GITHUB_ENV"


      - name: Show configuration
        run: |
          echo "GCP_PROJECT_ID=${GCP_PROJECT_ID}"
          echo "GCP_REGION=${GCP_REGION}"
          echo "MODEL_VERSION=${MODEL_VERSION}"
          echo "MODEL_BUCKET=${MODEL_BUCKET}"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/gcp/requirements.txt

      - name: Train model
        run: |
          python ml/gcp/train.py