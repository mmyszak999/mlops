name: Azure Kubernetes - Deploy Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version"
        required: true
        default: "v1"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      ARM_SUBSCRIPTION_ID: a71b1a56-760a-4510-9453-9525c3b99c8f
      ARM_CLIENT_ID: 53c2023d-035b-4459-a043-d5f9b50a032c
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: d81a2e37-d18e-42ec-8839-9a2de1586e0c

      MODEL_VERSION: ${{ inputs.model_version }}

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Azure Login
      # ==========================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ env.ARM_CLIENT_ID }}",
              "clientSecret": "${{ env.ARM_CLIENT_SECRET }}",
              "tenantId": "${{ env.ARM_TENANT_ID }}",
              "subscriptionId": "${{ env.ARM_SUBSCRIPTION_ID }}"
            }


      # ==========================================
      # Setup Terraform
      # ==========================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ==========================================
      # Terraform Init
      # ==========================================

      - name: Terraform Init
        working-directory: terraform/kubernetes/azure
        run: |
          terraform init \
            -input=false


      # ==========================================
      # Terraform outputs
      # ==========================================

      - name: Get Terraform outputs
        working-directory: terraform/kubernetes/azure
        run: |
          echo "AKS_CLUSTER_NAME=$(terraform output -raw cluster_name)" >> "$GITHUB_ENV"
          echo "AKS_RESOURCE_GROUP=$(terraform output -raw resource_group_name)" >> "$GITHUB_ENV"
          echo "ACR_NAME=$(terraform output -raw acr_name)" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)" >> "$GITHUB_ENV"

          echo "INFERENCE_IDENTITY_CLIENT_ID=$(terraform output -raw inference_identity_client_id)" >> "$GITHUB_ENV"


      # ==========================================
      # Get AKS credentials
      # ==========================================

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${AKS_RESOURCE_GROUP}" \
            --name "${AKS_CLUSTER_NAME}" \
            --overwrite-existing


      # ==========================================
      # Check Kubernetes
      # ==========================================

      - name: Check Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide


      # ==========================================
      # Check current platform
      # ==========================================

      - name: Check MLflow
        run: |
          kubectl get deployment mlflow \
            -n mlops

          kubectl get pods \
            -n mlops \
            -l app=mlflow


      # ==========================================
      # Check Inference ServiceAccount
      # ==========================================

      - name: Check Inference ServiceAccount
        run: |
          kubectl get serviceaccount mlops-inference \
            -n mlops \
            -o yaml


      # ==========================================
      # Prepare inference Deployment
      # ==========================================

      - name: Prepare inference deployment
        env:
          ACR_LOGIN_SERVER: ${{ env.ACR_LOGIN_SERVER }}
          MODEL_VERSION: ${{ env.MODEL_VERSION }}
        run: |
          python -m pip install --quiet pyyaml

          python <<'PY'
          import os
          import yaml

          source = "kubernetes/inference/deployment.yaml"
          target = "/tmp/inference-deployment.yaml"

          acr_login_server = os.environ["ACR_LOGIN_SERVER"]
          model_version = os.environ["MODEL_VERSION"]

          image = (
              f"{acr_login_server}/"
              f"mlops-thesis-k8s-inference:"
              f"{model_version}"
          )

          with open(source, "r", encoding="utf-8") as f:
              document = yaml.safe_load(f)

          pod_template = document["spec"]["template"]

          # ------------------------------------------
          # Azure Workload Identity
          # ------------------------------------------

          pod_template.setdefault("metadata", {})
          pod_template["metadata"].setdefault("labels", {})

          pod_template["metadata"]["labels"][
              "azure.workload.identity/use"
          ] = "true"

          # ------------------------------------------
          # Azure ServiceAccount
          # ------------------------------------------

          pod_template.setdefault("spec", {})

          pod_template["spec"][
              "serviceAccountName"
          ] = "mlops-inference"

          # ------------------------------------------
          # Inference image
          # ------------------------------------------

          containers = pod_template["spec"]["containers"]

          if not containers:
              raise RuntimeError(
                  "Inference Deployment does not contain any containers."
              )

          containers[0]["image"] = image

          with open(target, "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  document,
                  f,
                  sort_keys=False,
                  default_flow_style=False,
              )

          print(f"Inference image: {image}")
          print("ServiceAccount: mlops-inference")
          print("Azure Workload Identity enabled: true")
          print(f"Model version: {model_version}")
          PY


      # ==========================================
      # Apply inference Deployment
      # ==========================================

      - name: Apply inference deployment
        run: |
          kubectl apply \
            -f /tmp/inference-deployment.yaml


      # ==========================================
      # Apply inference Service
      # ==========================================

      - name: Apply inference service
        run: |
          kubectl apply \
            -f kubernetes/inference/service.yaml


      # ==========================================
      # Wait for inference
      # ==========================================

      - name: Wait for inference deployment
        run: |
          kubectl wait \
            --for=condition=available \
            deployment/mlops-inference \
            -n mlops \
            --timeout=10m


      # ==========================================
      # Check inference
      # ==========================================

      - name: Check inference
        run: |
          echo "=== Deployments ==="

          kubectl get deployments \
            -n mlops

          echo ""

          echo "=== Pods ==="

          kubectl get pods \
            -n mlops \
            -o wide

          echo ""

          echo "=== Services ==="

          kubectl get services \
            -n mlops

          echo ""

          echo "=== Inference Workload Identity ==="

          kubectl get deployment mlops-inference \
            -n mlops \
            -o jsonpath='{.spec.template.spec.serviceAccountName}'

          echo ""

          kubectl get deployment mlops-inference \
            -n mlops \
            -o jsonpath='{.spec.template.metadata.labels.azure\.workload\.identity/use}'

          echo ""