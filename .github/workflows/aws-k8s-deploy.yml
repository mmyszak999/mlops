name: AWS Kubernetes - Deploy Model

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Inference image version"
        required: true
        default: "1"

      model_registry_version:
        description: "MLflow Model Registry version"
        required: true
        default: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1

      EKS_CLUSTER_NAME: mlops-thesis-k8s

      INFERENCE_ECR_REPOSITORY: mlops-thesis-k8s-inference

      IMAGE_VERSION: ${{ inputs.image_version }}
      MODEL_REGISTRY_VERSION: ${{ inputs.model_registry_version }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Check AWS identity
        run: |
          aws sts get-caller-identity


      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build inference image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -f docker/inference/Dockerfile \
            -t "${ECR_REGISTRY}/${INFERENCE_ECR_REPOSITORY}:${IMAGE_VERSION}" \
            .


      - name: Push inference image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker push \
            "${ECR_REGISTRY}/${INFERENCE_ECR_REPOSITORY}:${IMAGE_VERSION}"


      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"


      - name: Check Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes


      - name: Apply namespace
        run: |
          kubectl apply \
            -f kubernetes/namespace.yaml


      - name: Apply AWS ServiceAccounts
        run: |
          kubectl apply \
            -f kubernetes/aws-service-accounts.yaml


      - name: Prepare inference deployment
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          sed \
            -e "s|INFERENCE_IMAGE_PLACEHOLDER|${ECR_REGISTRY}/${INFERENCE_ECR_REPOSITORY}:${IMAGE_VERSION}|g" \
            -e "s|MODEL_REGISTRY_VERSION_PLACEHOLDER|${MODEL_REGISTRY_VERSION}|g" \
            kubernetes/inference/deployment.yaml \
            > /tmp/inference-deployment.yaml

          echo "=== Generated deployment ==="
          cat /tmp/inference-deployment.yaml


      - name: Apply inference deployment
        run: |
          kubectl apply \
            -f /tmp/inference-deployment.yaml


      - name: Apply inference service
        run: |
          kubectl apply \
            -f kubernetes/inference/service.yaml


      - name: Wait for inference deployment
        run: |
          kubectl rollout status \
            deployment/mlops-inference \
            -n mlops \
            --timeout=10m


      - name: Show pods
        run: |
          kubectl get pods \
            -n mlops \
            -o wide


      - name: Show service
        run: |
          kubectl get service \
            mlops-inference \
            -n mlops


      - name: Show deployment
        run: |
          kubectl get deployment \
            mlops-inference \
            -n mlops