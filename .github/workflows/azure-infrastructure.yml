name: Azure Native - Infrastructure

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/azure

    env:
      ARM_SUBSCRIPTION_ID: a71b1a56-760a-4510-9453-9525c3b99c8f
      ARM_CLIENT_ID: 53c2023d-035b-4459-a043-d5f9b50a032c
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: d81a2e37-d18e-42ec-8839-9a2de1586e0c

      AZURE_RESOURCE_GROUP: mlops-thesis-azure
      AZURE_ML_WORKSPACE: mlops-thesis-aml

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ env.ARM_CLIENT_ID }}",
              "clientSecret": "${{ env.ARM_CLIENT_SECRET }}",
              "tenantId": "${{ env.ARM_TENANT_ID }}",
              "subscriptionId": "${{ env.ARM_SUBSCRIPTION_ID }}"
            }


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        run: |
          terraform init \
            -input=false


      - name: Remove existing Azure ML online endpoints
        working-directory: ${{ github.workspace }}
        run: |
          echo "Checking whether Azure ML workspace exists..."

          if az ml workspace show \
            --name "${AZURE_ML_WORKSPACE}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query name \
            -o tsv \
            > /tmp/workspace-name.txt 2>/dev/null
          then
            echo "Azure ML workspace exists."

            echo "Checking existing online endpoints..."

            ENDPOINTS=$(az ml online-endpoint list \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --workspace-name "${AZURE_ML_WORKSPACE}" \
              --query "[].name" \
              -o tsv)

            if [[ -z "${ENDPOINTS}" ]]; then
              echo "No Azure ML online endpoints found."
            else
              while IFS= read -r endpoint; do
                if [[ -n "${endpoint}" ]]; then
                  echo "Deleting Azure ML online endpoint: ${endpoint}"

                  az ml online-endpoint delete \
                    --name "${endpoint}" \
                    --resource-group "${AZURE_RESOURCE_GROUP}" \
                    --workspace-name "${AZURE_ML_WORKSPACE}" \
                    --yes

                  echo "Deleted endpoint: ${endpoint}"
                fi
              done <<< "${ENDPOINTS}"
            fi

          else
            echo "Azure ML workspace does not exist yet."
            echo "Skipping endpoint cleanup."
          fi


      - name: Terraform Format
        run: |
          terraform fmt -check -recursive



      - name: Terraform Validate
        run: |
          terraform validate


      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false


      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve


      - name: Terraform Outputs
        run: |
          terraform output